<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Symbol 2.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>AiHorizon</title>
  
  <script>
    document.addEventListener("wheel", function (event) {
      if (event.ctrlKey) {
        event.preventDefault(); // Prevent zooming via Ctrl + Scroll
      }
    }, { passive: false });

    document.addEventListener("keydown", function (event) {
      if (event.ctrlKey && (event.key === "+" || event.key === "-" || event.key === "0")) {
        event.preventDefault(); // Prevent zooming via keyboard shortcuts
      }
    });

    document.addEventListener("gesturestart", function (event) {
      event.preventDefault(); // Prevent pinch-to-zoom on iOS
    });

    document.addEventListener("gesturechange", function (event) {
      event.preventDefault();
    });

    document.addEventListener("gestureend", function (event) {
      event.preventDefault();
    });
  </script>

  <style>
    html, body {
      touch-action: manipulation; /* Prevents double-tap zoom */
      overflow-x: hidden; /* Avoids accidental scrolling */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

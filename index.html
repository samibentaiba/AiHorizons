<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Symbol 2.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AiHorizon</title>

  <script>
    function adjustZoom() {
      if (window.innerWidth < 1024) { // Apply only on mobile
        document.body.style.transform = "scale(0.5)";  // Zoom out to 50%
        document.body.style.transformOrigin = "top left"; 
        document.body.style.width = "200%"; // Ensure content fills the screen
      } else {
        document.body.style.transform = "scale(1)";  // Keep normal zoom on desktop
        document.body.style.width = "100%";
      }
    }

    window.onload = adjustZoom;
    window.addEventListener("resize", adjustZoom);
  </script>

  <style>
    html, body {
      overflow-x: hidden; /* Prevent horizontal scrolling */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

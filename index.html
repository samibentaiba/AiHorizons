  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AiHorizon</title>
  <script>
    function resetZoom() {
      document.body.style.zoom = "reset"; // Works in most browsers
      document.documentElement.style.zoom = "100%"; // Ensures zoom is 100%
    }

    window.onload = resetZoom;
    window.addEventListener("resize", resetZoom);
  </script>
</head>
